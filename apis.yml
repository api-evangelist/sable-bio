aid: sable-bio
name: Sable Bio
description: >-
  Sable Bio is a London-based drug-safety intelligence company building an
  AI-augmented platform, Sable Target Intelligence, that helps toxicologists,
  informaticians, and drug discovery scientists assess and mitigate target
  safety risk earlier in the drug development process. The platform aggregates
  and quantifies clinical, genetic, experimental, and literature evidence into a
  unified Target Safety Intelligence surface so safety teams can systematically
  prioritize and de-risk drug targets faster than traditional manual review. The
  company is headquartered in East London (Runway East Aldgate) and is backed by
  Episode One, Seedcamp, and MMC Ventures. Sable Bio was added to the API
  Evangelist network as a portfolio lead; as of this enrichment pass it operates
  a public marketing and product site with a Vanta-hosted trust center but does
  not yet publish a developer-facing API, documentation, or data-access surface.
